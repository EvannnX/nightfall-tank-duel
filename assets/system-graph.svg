<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
<title id="title">Nightfall system graph</title><desc id="desc">A loop from battlefield observation through player decisions, simulation, audiovisual feedback, interpretation, and adjustment, with challenge and ability variables.</desc>
<defs><linearGradient id="bg" x2="1" y2="1"><stop stop-color="#0c1325"/><stop offset="1" stop-color="#070b14"/></linearGradient><filter id="shadow"><feDropShadow dx="0" dy="8" stdDeviation="12" flood-opacity=".35"/></filter><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L9,3 L0,6 Z" fill="#8293bd"/></marker><style>text{font-family:Inter,Arial,sans-serif;fill:#f4f6fb}.title{font:700 42px Georgia,serif}.label{font-size:20px;font-weight:800}.copy{font-size:15px;fill:#b5bfd6}.small{font-size:13px;fill:#8f9bb8}.box{stroke-width:2;filter:url(#shadow)}.flow{fill:none;stroke:#8293bd;stroke-width:3;marker-end:url(#arrow)}.dashed{stroke-dasharray:8 8}.chip{fill:#151f38;stroke:#344363}.red{fill:#2b151d;stroke:#ff4c55}.blue{fill:#10223a;stroke:#2ba8ff}.violet{fill:#20172f;stroke:#a77cff}.gold{fill:#2a2215;stroke:#ffc65b}.green{fill:#13271f;stroke:#4bd39b}</style></defs>
<rect width="1600" height="900" fill="url(#bg)"/><text x="80" y="76" class="title">Nightfall: learning through ballistic evidence</text><text x="82" y="108" class="copy">Core shift: guessing a shot → calibrating the next shot from visible results</text>
<rect x="70" y="160" width="270" height="170" rx="18" class="box blue"/><text x="95" y="202" class="label">1. Observe</text><text x="95" y="236" class="copy"><tspan x="95">Enemy position and health</tspan><tspan x="95" dy="25">Terrain profile and craters</tspan><tspan x="95" dy="25">Wind direction and strength</tspan><tspan x="95" dy="25">Previous shot trail</tspan></text>
<rect x="410" y="160" width="300" height="170" rx="18" class="box violet"/><text x="435" y="202" class="label">2. Judge and choose</text><text x="435" y="236" class="copy"><tspan x="435">Reposition within 60 m</tspan><tspan x="435" dy="25">Select weapon</tspan><tspan x="435" dy="25">Set angle and power</tspan><tspan x="435" dy="25">Accept risk, then fire</tspan></text>
<rect x="780" y="160" width="330" height="170" rx="18" class="box gold"/><text x="805" y="202" class="label">3. Simulate</text><text x="805" y="236" class="copy"><tspan x="805">Launch velocity + gravity</tspan><tspan x="805" dy="25">Wind acceleration + shell mass</tspan><tspan x="805" dy="25">Terrain / tank collision</tspan><tspan x="805" dy="25">Blast falloff + crater update</tspan></text>
<rect x="1180" y="160" width="350" height="170" rx="18" class="box red"/><text x="1205" y="202" class="label">4. Receive feedback</text><text x="1205" y="236" class="copy"><tspan x="1205">Shell arc and persistent trail</tspan><tspan x="1205" dy="25">Explosion, sound, and screen light</tspan><tspan x="1205" dy="25">Damage numbers and health</tspan><tspan x="1205" dy="25">Permanent terrain deformation</tspan></text>
<path d="M340 245H400" class="flow"/><path d="M710 245H770" class="flow"/><path d="M1110 245H1170" class="flow"/>
<rect x="525" y="405" width="550" height="125" rx="18" class="box green"/><text x="550" y="447" class="label">5. Interpret and adjust</text><text x="550" y="479" class="copy">Too short / too long / blocked / near miss / direct hit</text><text x="550" y="505" class="copy">Change one or more variables on the next turn; the opponent also changes the state.</text>
<path d="M1355 330V467H1085" class="flow"/><path d="M515 467H205V340" class="flow"/><text x="230" y="452" class="small">next turn: updated evidence</text>
<rect x="70" y="620" width="455" height="200" rx="18" class="chip"/><text x="95" y="660" class="label">Challenge data</text><text x="95" y="696" class="copy"><tspan x="95">Night Valley — range calibration, moderate wind</tspan><tspan x="95" dy="28">Broken Ridge — obstruction, high arcs, terrain change</tspan><tspan x="95" dy="28">Rolling Hills — strong wind and longer exposure</tspan></text><text x="95" y="798" class="small">Difficulty grows by combining familiar variables, not hiding rules.</text>
<rect x="575" y="620" width="455" height="200" rx="18" class="chip"/><text x="600" y="660" class="label">Player abilities</text><text x="600" y="696" class="copy"><tspan x="600">Move: bounded positional correction</tspan><tspan x="600" dy="28">Aim: 0–180° world angle + 5–100% power</tspan><tspan x="600" dy="28">Weapons: Shell / Heavy / Cluster / Digger</tspan><tspan x="600" dy="28">Memory: compare current and previous trails</tspan></text>
<rect x="1080" y="620" width="450" height="200" rx="18" class="chip"/><text x="1105" y="660" class="label">Outcome range</text><text x="1105" y="696" class="copy"><tspan x="1105">Failure: self-hit, miss, blocked shot, defeat</tspan><tspan x="1105" dy="28">Just right: near miss reveals a useful correction</tspan><tspan x="1105" dy="28">Success: damage, tactical crater, destroyed opponent</tspan></text><text x="1105" y="798" class="small">Even failure returns specific visual and audio information.</text>
<path d="M298 620V565H650V540" class="flow dashed"/><path d="M802 620V540" class="flow dashed"/><path d="M1305 620V565H950V540" class="flow dashed"/>
</svg>
